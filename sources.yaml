# Direct RSS/Atom sources.
#
# Fields
#   id         unique slug (used in logs and the weekly review)
#   name       display name shown on the site as the story source
#   url        feed URL
#   type       gov | research | media | vendor
#   org        organization, used for the per-vendor daily cap (defaults to name)
#   ot_native  true = every item is OT-relevant, skip the keyword prefilter
#   enabled    false to pause a source without deleting it
#
# Run `python scripts/check_feeds.py` after editing to confirm every URL parses.
# Feeds marked "# verify" are best-known URLs that should be confirmed on first run.

sources:
  # ---------------- Government ----------------
  - id: cisa-ics
    name: CISA
    url: https://www.cisa.gov/cybersecurity-advisories/ics-advisories.xml
    type: gov
    ot_native: true
  - id: cisa-advisories
    name: CISA
    url: https://www.cisa.gov/cybersecurity-advisories/cybersecurity-advisories.xml
    type: gov
  - id: cisa-alerts
    name: CISA
    url: https://www.cisa.gov/cybersecurity-advisories/alerts.xml
    type: gov
  - id: cisa-news
    name: CISA
    url: https://www.cisa.gov/news.xml
    type: gov
  - id: ncsc-uk
    name: NCSC (UK)
    url: https://www.ncsc.gov.uk/api/1/services/v1/all-rss-feed.xml
    type: gov
  - id: cccs
    name: Canadian Centre for Cyber Security
    url: https://www.cyber.gc.ca/api/cccs/atom/v1/get?feed=alerts_advisories&lang=en
    type: gov
  - id: acsc-alerts
    name: ASD's ACSC (Australia)
    url: https://www.cyber.gov.au/rss/alerts
    type: gov
  - id: acsc-advisories
    name: ASD's ACSC (Australia)
    url: https://www.cyber.gov.au/rss/advisories
    type: gov
  - id: cert-eu
    name: CERT-EU
    url: https://cert.europa.eu/publications/security-advisories-rss
    type: gov
  - id: ms-isac
    name: CIS / MS-ISAC
    url: https://www.cisecurity.org/feed/advisories
    type: gov

  # ---------------- OT research teams ----------------
  - id: dragos
    name: Dragos
    url: https://www.dragos.com/feed/
    enabled: false   # no RSS feed exists; covered by the 'ot-vendor-sites' query
    type: research
    ot_native: true
  - id: claroty
    name: Claroty Team82
    org: Claroty
    url: https://claroty.com/team82/research/rss
    enabled: false   # no RSS feed exists; covered by the 'ot-vendor-sites' query
    type: research
    ot_native: true
  - id: nozomi
    name: Nozomi Networks Labs
    org: Nozomi Networks
    url: https://www.nozominetworks.com/blog/rss.xml
    enabled: false   # no RSS feed exists; covered by the 'ot-vendor-sites' query
    type: research
    ot_native: true
  - id: forescout
    name: Forescout Vedere Labs
    org: Forescout
    url: https://www.forescout.com/feed/   # verify
    type: research
  - id: txone
    name: TXOne Networks
    org: TXOne
    url: https://www.txone.com/feed/
    enabled: false   # no RSS feed exists; covered by the 'ot-vendor-sites' query
    type: research
    ot_native: true
  - id: kaspersky-ics
    name: Kaspersky ICS CERT
    org: Kaspersky
    url: https://ics-cert.kaspersky.com/feed/   # verify
    type: research
    ot_native: true
  - id: waterfall
    name: Waterfall Security
    url: https://waterfall-security.com/feed/   # verify
    type: vendor
    ot_native: true

  # General threat-intel teams (prefiltered for OT relevance)
