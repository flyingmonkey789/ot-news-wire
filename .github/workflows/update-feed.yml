name: Update feed

on:
  schedule:
    - cron: "17 * * * *"   # hourly, off the :00 rush
  workflow_dispatch:        # "Run workflow" button for manual runs
  push:                     # re-run right away when you edit config or code
    branches: [main]
    paths:
      - "*.yaml"
      - "pipeline/**"
      - ".github/workflows/update-feed.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}   # optional
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pipeline.run

      - name: Commit feed and state
        run: |
          git config user.name "ot-wire-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feed.json docs/feed.xml data/
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update feed $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Rebase in case config files were edited while the run was in progress.
          for i in 1 2 3; do
            git pull --rebase --strategy-option=theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
